server:
  port: 8081

spring:
  application:
    name: ssafy-home-admin-service
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  config:
    import:
      - optional:classpath:secret/application-secret.yml
      - optional:file:../secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

molit:
  page-size: 100
  timeout: 10s
  retry-count: 2
  skip-limit: 1000

vworld:
  data-url: https://api.vworld.kr/req/data
  legal-emd-layer: LT_C_ADEMD_INFO
  page-size: 1000
  timeout: 10s
  retry-count: 2
  sido-retry-count: 3
  skip-limit: 1000

jwt:
  access-token-expiration-millis: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized
