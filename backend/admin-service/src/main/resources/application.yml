server:
  port: 8081

spring:
  application:
    name: ssafy-home-admin-service
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  config:
    import:
      - optional:classpath:secret/application-secret.yml
      - optional:file:../secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

molit:
  page-size: 100
  timeout: 10s
  retry-count: 2
  skip-limit: 1000

vworld:
  data-url: https://api.vworld.kr/req/data
  legal-emd-layer: LT_C_ADEMD_INFO
  page-size: 1000
  timeout: 10s
  retry-count: 2
  sido-retry-count: 3
  skip-limit: 1000

sdsc:
  store-list-url: https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInUpjong
  page-size: 1000
  timeout: 15s
  retry-count: 2
  skip-limit: 500

seoul:
  environment:
    base-url: https://openapi.seoul.go.kr:8088
    page-size: 1000
    timeout: 15s
    retry-count: 2
    skip-limit: 500
    datasets:
      - key: inspection
        category: 환경지도점검
        service-name: ${SEOUL_ENV_INSPECTION_SERVICE_NAME:EnvGuideInspection}
        item-name-field: ${SEOUL_ENV_INSPECTION_ITEM_NAME_FIELD:ITEM_NAME}
        value-field: ${SEOUL_ENV_INSPECTION_VALUE_FIELD:VALUE}
        unit-field: ${SEOUL_ENV_INSPECTION_UNIT_FIELD:UNIT}
        measured-date-field: ${SEOUL_ENV_INSPECTION_MEASURED_DATE_FIELD:MEASURED_DATE}
        latitude-field: ${SEOUL_ENV_INSPECTION_LATITUDE_FIELD:LAT}
        longitude-field: ${SEOUL_ENV_INSPECTION_LONGITUDE_FIELD:LNG}
      - key: green
        category: 녹지
        service-name: ${SEOUL_ENV_GREEN_SERVICE_NAME:GreenInfo}
        item-name-field: ${SEOUL_ENV_GREEN_ITEM_NAME_FIELD:ITEM_NAME}
        value-field: ${SEOUL_ENV_GREEN_VALUE_FIELD:VALUE}
        unit-field: ${SEOUL_ENV_GREEN_UNIT_FIELD:UNIT}
        measured-date-field: ${SEOUL_ENV_GREEN_MEASURED_DATE_FIELD:MEASURED_DATE}
        latitude-field: ${SEOUL_ENV_GREEN_LATITUDE_FIELD:LAT}
        longitude-field: ${SEOUL_ENV_GREEN_LONGITUDE_FIELD:LNG}
      - key: wastewater
        category: 폐수 배출
        service-name: ${SEOUL_ENV_WASTEWATER_SERVICE_NAME:WastewaterEmission}
        item-name-field: ${SEOUL_ENV_WASTEWATER_ITEM_NAME_FIELD:ITEM_NAME}
        value-field: ${SEOUL_ENV_WASTEWATER_VALUE_FIELD:VALUE}
        unit-field: ${SEOUL_ENV_WASTEWATER_UNIT_FIELD:UNIT}
        measured-date-field: ${SEOUL_ENV_WASTEWATER_MEASURED_DATE_FIELD:MEASURED_DATE}
        latitude-field: ${SEOUL_ENV_WASTEWATER_LATITUDE_FIELD:LAT}
        longitude-field: ${SEOUL_ENV_WASTEWATER_LONGITUDE_FIELD:LNG}
      - key: air
        category: 대기 배출
        service-name: ${SEOUL_ENV_AIR_SERVICE_NAME:AirEmission}
        item-name-field: ${SEOUL_ENV_AIR_ITEM_NAME_FIELD:ITEM_NAME}
        value-field: ${SEOUL_ENV_AIR_VALUE_FIELD:VALUE}
        unit-field: ${SEOUL_ENV_AIR_UNIT_FIELD:UNIT}
        measured-date-field: ${SEOUL_ENV_AIR_MEASURED_DATE_FIELD:MEASURED_DATE}
        latitude-field: ${SEOUL_ENV_AIR_LATITUDE_FIELD:LAT}
        longitude-field: ${SEOUL_ENV_AIR_LONGITUDE_FIELD:LNG}
  demographics:
    base-url: https://openapi.seoul.go.kr:8088
    page-size: 1000
    timeout: 15s
    retry-count: 2
    skip-limit: 500
    population:
      service-name: SPOP_PEOPLE_INGU_JACHI
      sido-field: SIDO_NM
      sigungu-field: SIGNGU_NM
      dong-field: ADSTRD_NM
      total-population-field: PPLTN_CNT
      household-field: HOUSE_CNT
      senior-field: AGRDE_65_ABOVE_PPLTN_CNT
      reference-date-field: STDR_DE_ID
    foreign-resident:
      service-name: SPOP_FRNR_RNTS
      sido-field: SIDO_NM
      sigungu-field: SIGNGU_NM
      dong-field: ADSTRD_NM
      foreign-count-field: FRNR_CNT
      reference-date-field: STDR_DE_ID

batch:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}
    timeout: ${AI_SERVICE_TIMEOUT:30s}
  report:
    output-dir: ${BATCH_REPORT_OUTPUT_DIR:./reports/batch}
    font-path: ${BATCH_REPORT_FONT_PATH:}
    max-deals: ${BATCH_REPORT_MAX_DEALS:20}
  scheduler:
    enabled: ${BATCH_SCHEDULER_ENABLED:false}
    region-code: ${BATCH_SCHEDULER_REGION_CODE:11110}
    year-month: ${BATCH_SCHEDULER_YEAR_MONTH:}
    house-type: ${BATCH_SCHEDULER_HOUSE_TYPE:APARTMENT}
    deal-type: ${BATCH_SCHEDULER_DEAL_TYPE:SALE}
    system-member-id: ${BATCH_SCHEDULER_SYSTEM_MEMBER_ID:0}
    house-deal-cron: ${BATCH_SCHEDULER_HOUSE_DEAL_CRON:0 0 3 * * *}
    report-cron: ${BATCH_SCHEDULER_REPORT_CRON:0 30 3 * * *}

jwt:
  access-token-expiration-millis: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized

app:
  admin:
    csrf:
      allowed-origins:
        - "http://localhost:5174"
        - "http://127.0.0.1:5174"
