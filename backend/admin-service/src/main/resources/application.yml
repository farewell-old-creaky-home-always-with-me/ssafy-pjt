server:
  port: 8081

spring:
  application:
    name: ssafy-home-admin-service
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  config:
    import: optional:classpath:secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ssafy_home?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:ssafy}
    password: ${SPRING_DATASOURCE_PASSWORD:ssafy}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

molit:
  apartment-sale-url: ${MOLIT_APARTMENT_SALE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev}
  multi-family-sale-url: ${MOLIT_MULTI_FAMILY_SALE_URL:https://apis.data.go.kr/1613000/RTMSDataSvcRHTradeDev/getRTMSDataSvcRHTradeDev}
  service-key: ${MOLIT_SERVICE_KEY:your-data-go-kr-service-key}
  page-size: 100
  timeout: 10s
  retry-count: 2
  skip-limit: 1000

vworld:
  data-url: ${VWORLD_DATA_URL:https://api.vworld.kr/req/data}
  api-key: ${VWORLD_API_KEY:your-vworld-api-key}
  domain: ${VWORLD_DOMAIN:localhost}
  legal-emd-layer: LT_C_ADEMD_INFO
  page-size: 1000
  timeout: 10s
  retry-count: 2
  sido-retry-count: 3
  skip-limit: 1000

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"
  exposed-headers:
    - "Location"
  allow-credentials: true
  max-age: 3600

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-ssafy-home-project-2026}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized
