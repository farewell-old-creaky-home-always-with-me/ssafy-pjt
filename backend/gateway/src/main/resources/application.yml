server:
  port: 8080

spring:
  application:
    name: ssafy-home-gateway
  config:
    import:
      - optional:classpath:secret/application-secret.yml
      - optional:file:../secret/application-secret.yml
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: admin-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/admin/**
            - id: admin-notice-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/notices,/api/notices/**
                - Method=POST,PUT,DELETE
            - id: main-notice-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/notices,/api/notices/**
                - Method=GET
            - id: ai-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat,/api/chat/**
            - id: main-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/**
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                  - "http://localhost:5174"
                  - "http://127.0.0.1:5174"
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
