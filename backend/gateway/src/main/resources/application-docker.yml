spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: admin-service
              uri: http://admin-service:8081
              predicates:
                - Path=/api/admin/**
            - id: admin-notice-service
              uri: http://admin-service:8081
              predicates:
                - Path=/api/notices,/api/notices/**
                - Method=POST,PUT,DELETE
            - id: main-notice-service
              uri: http://main-service:8082
              predicates:
                - Path=/api/notices,/api/notices/**
                - Method=GET
            - id: ai-service
              uri: http://ai-service:8083
              predicates:
                - Path=/api/chat/**
            - id: main-service
              uri: http://main-service:8082
              predicates:
                - Path=/api/**
