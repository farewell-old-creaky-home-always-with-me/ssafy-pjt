services:
  gateway:
    image: eclipse-temurin:17-jre
    container_name: ssafy-home-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-key-for-ssafy-home-project-2026}
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: admin-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://admin-service:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/admin/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: admin-notice-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://admin-service:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/api/notices,/api/notices/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_1: Method=POST,PUT,DELETE
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: main-notice-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://main-service:8082
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/api/notices,/api/notices/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_1: Method=GET
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: ai-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://ai-service:8083
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/api/chat/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: main-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://main-service:8082
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/api/**
    volumes:
      - ./gateway/build/libs/gateway-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      - admin-service
      - main-service
      - ai-service

  admin-service:
    image: eclipse-temurin:17-jre
    container_name: ssafy-home-admin-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-key-for-ssafy-home-project-2026}
      SPRING_CONFIG_IMPORT: optional:classpath:secret/application-secret.yml
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssafy_home?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy
      MOLIT_APARTMENT_SALE_URL: ${MOLIT_APARTMENT_SALE_URL:-https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev}
      MOLIT_MULTI_FAMILY_SALE_URL: ${MOLIT_MULTI_FAMILY_SALE_URL:-https://apis.data.go.kr/1613000/RTMSDataSvcRHTradeDev/getRTMSDataSvcRHTradeDev}
      MOLIT_SERVICE_KEY: ${MOLIT_SERVICE_KEY:-your-data-go-kr-service-key}
      VWORLD_DATA_URL: ${VWORLD_DATA_URL:-https://api.vworld.kr/req/data}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-your-vworld-api-key}
      VWORLD_DOMAIN: ${VWORLD_DOMAIN:-localhost}
    volumes:
      - ./admin-service/build/libs/admin-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      mysql:
        condition: service_healthy

  main-service:
    image: eclipse-temurin:17-jre
    container_name: ssafy-home-main-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-key-for-ssafy-home-project-2026}
      SPRING_CONFIG_IMPORT: optional:classpath:secret/application-secret.yml
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssafy_home?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy
    volumes:
      - ./main-service/build/libs/main-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      mysql:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:latest
    container_name: ssafy-home-chroma
    ports:
      - "8000:8000"

  ai-service:
    image: eclipse-temurin:17-jre
    container_name: ssafy-home-ai-service
    ports:
      - "8083:8083"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    volumes:
      - ./ai-service/build/libs/ai-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      - chroma

  mysql:
    image: mysql:8.0
    container_name: ssafy-home-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ssafy_home
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ssafy", "-pssafy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.5.0
    container_name: ssafy-home-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: ssafy-home-alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy
      - ./logs:/logs
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.1
    container_name: ssafy-home-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: ssafy-home-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  mysql_data:
  loki_data:
  grafana_data:
  prometheus_data:
