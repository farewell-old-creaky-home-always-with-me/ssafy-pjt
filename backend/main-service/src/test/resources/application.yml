app:
  database:
    seed-enabled: false

spring:
  flyway:
    enabled: false
  config:
    import: optional:classpath:secret/application-secret.yml
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations:

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-jwt-secret-key-for-ssafy-home-project-2026
  access-token-expiration-millis: 3600000
