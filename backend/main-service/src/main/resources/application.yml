server:
  port: 8082

spring:
  application:
    name: ssafy-home-backend
  config:
    import: classpath:secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

jwt:
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized

app:
  database:
    seed-enabled: true
