server:
  port: 8082

spring:
  application:
    name: ssafy-home-backend
  config:
    import:
      - optional:classpath:secret/application-secret.yml
      - optional:file:../secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

jwt:
  access-token-expiration-millis: 3600000

batch:
  report:
    output-dir: ${BATCH_REPORT_OUTPUT_DIR:./reports/batch}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized

app:
  database:
    seed-enabled: true
