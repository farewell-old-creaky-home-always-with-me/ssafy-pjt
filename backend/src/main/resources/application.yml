spring:
  application:
    name: ssafy-home-backend
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  config:
    import: classpath:secret/application-secret.yml
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

molit:
  page-size: 100
  timeout: 10s
  retry-count: 2
  skip-limit: 1000

vworld:
  data-url: https://api.vworld.kr/req/data
  legal-emd-layer: LT_C_ADEMD_INFO
  page-size: 1000
  timeout: 10s
  retry-count: 2
  sido-retry-count: 3
  skip-limit: 1000

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"
  exposed-headers:
    - "Location"
  allow-credentials: true
  max-age: 3600

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized

app:
  database:
    seed-enabled: true
