spring:
  application:
    name: ssafy-home-backend
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${BATCH_JDBC_INITIALIZE_SCHEMA:never}
  config:
    import: classpath:secret/application-secret.yml
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ssafy.home
  configuration:
    map-underscore-to-camel-case: true

molit:
  apartment-sale-url: ${MOLIT_APARTMENT_SALE_URL}
  multi-family-sale-url: ${MOLIT_MULTI_FAMILY_SALE_URL}
  service-key: ${MOLIT_SERVICE_KEY}
  page-size: ${MOLIT_PAGE_SIZE:100}
  timeout: ${MOLIT_TIMEOUT:10s}
  retry-count: ${MOLIT_RETRY_COUNT:2}

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"
  exposed-headers:
    - "Location"
  allow-credentials: true
  max-age: 3600

server:
  servlet:
    session:
      timeout: 30m
