server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ssafy-home
    static_configs:
      - targets:
          - localhost
        labels:
          job: ssafy-home
          app: backend
          env: local
          __path__: /logs/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
      - labels:
          level:
          logger:
