server:
  port: 8083

spring:
  application:
    name: ssafy-home-ai-service
  config:
    import:
      - optional:classpath:secret/application-secret.yml
      - optional:file:../secret/application-secret.yml
  ai:
    openai:
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-ada-002
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: ssafy-home-docs
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  access-token-expiration-millis: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: when-authorized
