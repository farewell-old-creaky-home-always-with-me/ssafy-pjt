name: Sync to GitLab

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: GitLab sync target
        required: true
        default: gateway
        type: choice
        options:
          - gateway
          - all
          - artifact
          - admin-service
          - ai-service
          - main-service
          - frontend
          - frontend-admin
          - infra

jobs:
  sync:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed directories
        id: detect
        run: |
          SYNC_ARTIFACT=false
          SYNC_ADMIN_SERVICE=false
          SYNC_AI_SERVICE=false
          SYNC_MAIN_SERVICE=false
          SYNC_GATEWAY=false
          SYNC_FRONTEND=false
          SYNC_FRONTEND_ADMIN=false
          SYNC_INFRA=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            echo "Manual sync target: $TARGET"

            if [ "$TARGET" = "all" ] || [ "$TARGET" = "artifact" ]; then
              SYNC_ARTIFACT=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "admin-service" ]; then
              SYNC_ADMIN_SERVICE=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "ai-service" ]; then
              SYNC_AI_SERVICE=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "main-service" ]; then
              SYNC_MAIN_SERVICE=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "gateway" ]; then
              SYNC_GATEWAY=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "frontend" ]; then
              SYNC_FRONTEND=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "frontend-admin" ]; then
              SYNC_FRONTEND_ADMIN=true
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "infra" ]; then
              SYNC_INFRA=true
            fi
          else
            CHANGED=$(git diff ${{ github.event.before }}..${{ github.sha }} --name-only)
            echo "Changed files:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -q "^artifact/"; then
              SYNC_ARTIFACT=true
            fi
            if echo "$CHANGED" | grep -q "^backend/admin-service/"; then
              SYNC_ADMIN_SERVICE=true
            fi
            if echo "$CHANGED" | grep -q "^backend/ai-service/"; then
              SYNC_AI_SERVICE=true
            fi
            if echo "$CHANGED" | grep -q "^backend/main-service/"; then
              SYNC_MAIN_SERVICE=true
            fi
            if echo "$CHANGED" | grep -q "^backend/gateway/"; then
              SYNC_GATEWAY=true
            fi
            if echo "$CHANGED" | grep -q "^frontend/"; then
              SYNC_FRONTEND=true
            fi
            if echo "$CHANGED" | grep -q "^frontend-admin/"; then
              SYNC_FRONTEND_ADMIN=true
            fi
            if echo "$CHANGED" | grep -q "^infra/"; then
              SYNC_INFRA=true
            fi
          fi

          echo "sync_artifact=$SYNC_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "sync_admin_service=$SYNC_ADMIN_SERVICE" >> "$GITHUB_OUTPUT"
          echo "sync_ai_service=$SYNC_AI_SERVICE" >> "$GITHUB_OUTPUT"
          echo "sync_main_service=$SYNC_MAIN_SERVICE" >> "$GITHUB_OUTPUT"
          echo "sync_gateway=$SYNC_GATEWAY" >> "$GITHUB_OUTPUT"
          echo "sync_frontend=$SYNC_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "sync_frontend_admin=$SYNC_FRONTEND_ADMIN" >> "$GITHUB_OUTPUT"
          echo "sync_infra=$SYNC_INFRA" >> "$GITHUB_OUTPUT"

      - name: Sync artifact to GitLab
        if: steps.detect.outputs.sync_artifact == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/artifact" /tmp/artifact-gitlab

          find /tmp/artifact-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' artifact/ /tmp/artifact-gitlab/

          cd /tmp/artifact-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to artifact, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync admin-service to GitLab
        if: steps.detect.outputs.sync_admin_service == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/admin-backend" /tmp/admin-backend-gitlab

          find /tmp/admin-backend-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' --exclude='src/main/resources/secret' backend/admin-service/ /tmp/admin-backend-gitlab/

          cd /tmp/admin-backend-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to admin-service, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync ai-service to GitLab
        if: steps.detect.outputs.sync_ai_service == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/ai-backend" /tmp/ai-backend-gitlab

          find /tmp/ai-backend-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' --exclude='src/main/resources/secret' backend/ai-service/ /tmp/ai-backend-gitlab/

          cd /tmp/ai-backend-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to ai-service, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync main-service to GitLab
        if: steps.detect.outputs.sync_main_service == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/main-backend" /tmp/main-backend-gitlab

          find /tmp/main-backend-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' --exclude='src/main/resources/secret' backend/main-service/ /tmp/main-backend-gitlab/

          cd /tmp/main-backend-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to main-service, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync gateway to GitLab
        if: steps.detect.outputs.sync_gateway == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/gateway" /tmp/gateway-gitlab

          find /tmp/gateway-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' --exclude='src/main/resources/secret' backend/gateway/ /tmp/gateway-gitlab/

          cd /tmp/gateway-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to gateway, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync frontend to GitLab
        if: steps.detect.outputs.sync_frontend == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/frontend.git" /tmp/frontend-gitlab

          find /tmp/frontend-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' frontend/ /tmp/frontend-gitlab/

          cd /tmp/frontend-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to frontend, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync frontend-admin to GitLab
        if: steps.detect.outputs.sync_frontend_admin == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/frontend-admin" /tmp/frontend-admin-gitlab

          find /tmp/frontend-admin-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' frontend-admin/ /tmp/frontend-admin-gitlab/

          cd /tmp/frontend-admin-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to frontend-admin, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi

      - name: Sync infra to GitLab
        if: steps.detect.outputs.sync_infra == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an")
          COMMIT_EMAIL=$(git log -1 --pretty="%ae")

          git clone "https://서울_10반_관통_9조:$GITLAB_TOKEN@lab.ssafy.com/s15/a10/project/finalproject/9jo/infra" /tmp/infra-gitlab

          find /tmp/infra-gitlab -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          rsync -av --exclude='.git' infra/ /tmp/infra-gitlab/

          cd /tmp/infra-gitlab
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to infra, skipping push"
          else
            git commit -m "$COMMIT_MSG"
            git push -u origin HEAD:main
          fi
