name: Frontend CI

on:
  push:
    branches: [master]
    paths: ["frontend/**"]
  pull_request:
    branches: [master]
    paths: ["frontend/**"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        working-directory: frontend
        run: npx --yes htmlhint@latest "*.html"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
