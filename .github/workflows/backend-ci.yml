name: Backend CI

on:
  push:
    branches: [master]
    paths: ["backend/**"]
  pull_request:
    branches: [master]
    paths: ["backend/**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create application-secret stub
        run: |
          mkdir -p backend/src/main/resources/secret
          cat > backend/src/main/resources/secret/application-secret.yml << 'EOF'
          spring:
            datasource:
              url: jdbc:mysql://localhost:3306/ssafy_home
              username: ci
              password: ci
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test
